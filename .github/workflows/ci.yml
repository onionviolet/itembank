name: ci

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sample fixture lints clean
        run: |
          python itembank.py lint fixtures/sample_bank.md
          test "$(python itembank.py lint fixtures/sample_bank.md | grep -c '^error')" = "0"

      - name: Broken fixture is caught
        run: |
          if python itembank.py lint fixtures/broken_bank.md; then
            echo "linter passed a deliberately broken bank; it regressed"
            exit 1
          fi
          for msg in "SELECT is 2" "does not exist" "not in CATEGORIES" \
                     "duplicate steps" "no WHY BEST" "stem duplicates" \
                     "WOULD be correct" "CONFIDENCE is low" \
                     "does not match any lesson heading" "collides with" \
                     "is not referenced by any item"; do
            python itembank.py lint fixtures/broken_bank.md | grep -q "$msg" \
              || { echo "linter no longer reports: $msg"; exit 1; }
          done

      - name: Sample fixture builds
        run: python itembank.py build fixtures/sample_bank.md /tmp/out.html

      # Drives a real session end to end and validates every payload it produces
      # against schemas/*.json with schema_validate.py -- the CI half of PROTO-04.
      # Everything happens under /tmp so nothing lands in the checkout; the one
      # `|| true` is on `lint`, whose non-zero exit on a broken bank is expected,
      # and its output is validated on the very next line so an empty file can't
      # slip through unnoticed.
      - name: Runtime output matches published schema
        run: |
          set -e
          cp fixtures/sample_bank.md /tmp/bank.md
          python itembank.py start /tmp/bank.md --count 3 --seed 1 --out /tmp/s.json > /tmp/start.json
          python schema_validate.py schemas/session.schema.json /tmp/s.json
          python -c "import json, sys
          json.dump(json.load(open(sys.argv[1], encoding='utf-8'))['item'],
                    open(sys.argv[2], 'w', encoding='utf-8'))" /tmp/start.json /tmp/item.json
          python schema_validate.py schemas/item.schema.json /tmp/item.json
          python itembank.py submit /tmp/s.json --answer A --confidence high
          # The log is a multi-type append-only stream (response, hint,
          # selection, ...) and response.schema.json is one type's contract,
          # not the stream's -- filter to response-typed lines before the
          # per-type validation (plan 07-04).
          python -c "import json, sys
          lines = [l for l in open('/tmp/_evidence/evidence.jsonl', encoding='utf-8')
                   if json.loads(l).get('event_type') == 'response']
          open('/tmp/evidence_responses.jsonl', 'w', encoding='utf-8').writelines(lines)" 
          python schema_validate.py schemas/response.schema.json --jsonl /tmp/evidence_responses.jsonl
          python itembank.py report /tmp/s.json > /tmp/report.json
          python -c "import json, sys
          json.dump(json.load(open(sys.argv[1], encoding='utf-8'))['summary'],
                    open(sys.argv[2], 'w', encoding='utf-8'))" /tmp/report.json /tmp/report_summary.json
          python schema_validate.py schemas/report.schema.json /tmp/report_summary.json
          OBJ=$(python -c "import json, sys
          print(json.load(open(sys.argv[1], encoding='utf-8'))['item']['objective'])" /tmp/start.json)
          python itembank.py evidence --objective "$OBJ" --base /tmp > /tmp/history.json
          python schema_validate.py schemas/report.schema.json /tmp/history.json
          python itembank.py lint fixtures/broken_bank.md --json > /tmp/lint.json || true
          python schema_validate.py schemas/lint_error.schema.json --array /tmp/lint.json errors
          python schema_validate.py schemas/lint_error.schema.json --array /tmp/lint.json warnings
          python itembank.py lint fixtures/lesson_broken_src_bank.md --json > /tmp/lint-src.json || true
          python schema_validate.py schemas/lint_error.schema.json --array /tmp/lint-src.json errors
          python schema_validate.py schemas/lint_error.schema.json --array /tmp/lint-src.json warnings

      # Every file under tests/, rather than a named list. The list had already
      # drifted: two test files existed that CI never ran, so they could fail
      # for weeks without anyone hearing about it.
      - name: Test suite
        run: |
          for t in tests/*.py; do
            echo "== $t"
            python "$t" || exit 1
          done

      - name: No real question bank committed
        run: python itembank.py guard .

      # The two skill trees are mirrors by convention (AGENTS.md); CI makes
      # the convention mechanical so drift fails the build instead of
      # silently desyncing Claude Code from every other agent.
      - name: Skill mirrors stay identical
        run: diff -rq .agents/skills .claude/skills

      # The README documents the shipped surface only: every bare command
      # token in a README code block must be a subcommand `itembank.py
      # --help` registers (plan 999.5-02; precedent: 05-07's claim-word
      # gate). Flags are not checked -- only bare command names.
      - name: README command index names only shipped subcommands
        run: python scripts/check_readme_commands.py

      # Every schemas/*.json is exercised in CI (plan 999.5-02): `--all`
      # structurally self-checks all twelve documents (parse + the whole
      # check_schema walk), closing the seven-document gap where a schema
      # could rot without a test producing an instance of it. Instance
      # validation for the five session-contract schemas runs in the
      # "Runtime output matches published schema" step above; the remaining
      # seven (visual_interaction, agent_usage, model_adapter, tier_gate,
      # selection, settings, update_manifest) get their real-payload
      # validation in the roundtrip tests (visual_evidence_roundtrip,
      # model_surface_roundtrip, model_adapter_roundtrip, model_gate_roundtrip,
      # selection_roundtrip, config_roundtrip, update_roundtrip) that the
      # Test suite step runs -- the self-check here guarantees none of them
      # is silently absent.
      - name: Every published schema self-checks
        run: python schema_validate.py --all schemas

      # Machine-specific paths (this machine's checkout, username, AppData)
      # leak into agent docs/config and break external users' clones.
      - name: No machine-specific path in agent docs or config
        run: |
          if grep -rE "C:/Users|C:\\\\Users|/Users/wayba|wayba" \
              AGENTS.md README.md .agents .claude reasonix.toml.example; then
            echo "machine-specific path leaked into agent-facing files"
            exit 1
          fi
          echo "agent docs are path-clean"
