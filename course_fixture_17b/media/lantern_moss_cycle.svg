<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="t d">
  <title id="t">The lantern moss annual cycle</title>
  <desc id="d">Four phases arranged in a clockwise circle: spring green-up
  at the top, early-summer investment on the right, the late-summer
  lantern phase at the bottom, and the autumn wager on the left. The
  arrow into early-summer investment is marked as the hinge: the water
  position in early summer decides whether a shoot initiates fertile
  stems or banks the season as vegetative growth.</desc>
  <style>text{font-family:sans-serif;font-size:16px;fill:#1a1a1a}</style>
  <circle cx="320" cy="200" r="140" fill="none" stroke="#5b7a5b" stroke-width="2"/>
  <rect x="240" y="20" width="160" height="44" rx="8" fill="#e8f0e8" stroke="#5b7a5b"/>
  <text x="320" y="47" text-anchor="middle">Spring green-up</text>
  <rect x="460" y="178" width="176" height="44" rx="8" fill="#fdf1dc" stroke="#a67c2e"/>
  <text x="548" y="205" text-anchor="middle">Early-summer invest</text>
  <rect x="230" y="336" width="180" height="44" rx="8" fill="#e8f0e8" stroke="#5b7a5b"/>
  <text x="320" y="363" text-anchor="middle">Late-summer lantern</text>
  <rect x="10" y="178" width="170" height="44" rx="8" fill="#e8f0e8" stroke="#5b7a5b"/>
  <text x="95" y="205" text-anchor="middle">Autumn wager</text>
  <path d="M 420 70 A 140 140 0 0 1 500 160" fill="none" stroke="#a67c2e" stroke-width="4" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#a67c2e"/></marker></defs>
  <text x="480" y="110" text-anchor="middle" fill="#a67c2e">the hinge</text>
</svg>
