<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Runtime status</title>
<style>
:root{
  --bg:#f3f5f4; --card:#ffffff; --ink:#171d1c; --mut:#5f6d6a; --line:#dfe5e3; --accent:#0e6e62; --accent-soft:#cfe2e0; --ok:#1b7a3d; --ok-bg:#e8f4ec; --bad:#b4272b; --bad-bg:#fbebeb; --warn:#8a5900; --chip:#eef2f1;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0e1413; --card:#161e1d; --ink:#e4ebe9; --mut:#8fa19d; --line:#26312f; --accent:#139484; --accent-soft:#161e1d; --ok:#4fbf74; --ok-bg:#11291b; --bad:#f0666a; --bad-bg:#2b1416; --warn:#e0a23a; --chip:#1d2726;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-chrome, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif);
  font-size: 16px; line-height: 1.5;
  padding: 48px 24px 64px;
}
@media (min-width: 768px) { body { padding: 48px 48px 64px; } }
main { max-width: 720px; margin: 0 auto; }
.state-label {
  font-family: var(--font-ledger, ui-monospace, "Cascadia Mono", Consolas, monospace);
  font-size: 12px; font-weight: 600; line-height: 1.4;
  margin: 0 0 8px; color: var(--warn);
}
body[data-state="crashed"] .state-label { color: var(--bad); }
h1 { font-size: 20px; font-weight: 600; line-height: 1.2; margin: 0 0 16px; }
p { margin: 0 0 16px; }
.meta { font-family: var(--font-ledger, ui-monospace, "Cascadia Mono", Consolas, monospace); font-size: 12px; line-height: 1.4; color: var(--mut); }
details { margin: 16px 0; border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; }
summary { cursor: pointer; font-weight: 600; min-height: 44px; display: flex; align-items: center; }
pre { white-space: pre-wrap; overflow-wrap: anywhere; font-family: var(--font-ledger, ui-monospace, "Cascadia Mono", Consolas, monospace); font-size: 12px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 24px; }
button, a.go {
  min-height: 44px; padding: 0 20px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--card); color: var(--ink); font: inherit; font-weight: 600;
  text-decoration: none; display: inline-flex; align-items: center; justify-content: center;
}
button.primary, a.go.primary { background: var(--accent); color: var(--card); border-color: var(--accent); }
button:focus-visible, a.go:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[role="status"] { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.code { font-family: var(--font-ledger, ui-monospace, "Cascadia Mono", Consolas, monospace); font-size: 12px; }

</style>
</head>
<body>
<main>
  <h1 id="title" tabindex="-1">Runtime status</h1>
  <p class="meta">runtime: listening on <span class="code" data-port>127.0.0.1:&lt;port&gt;</span></p>
  <p class="meta">pid <span class="code" data-pid>&lt;n&gt;</span></p>
  <p class="meta">started <span class="code" data-started>&lt;ISO-8601&gt;</span></p>
  <p class="meta">version <span class="code" data-version>&lt;v&gt;</span></p>
  <p class="meta">log <span class="code" data-log>&lt;path&gt;</span></p>
  <p class="meta">The runtime also runs without this window:</p>
  <pre>itembank daemon .</pre>
  <p role="status" id="status">Runtime status</p>
</main>
<script>
(function () {
  "use strict";
  var params = new URLSearchParams(location.search);
  function fill(attr, key) {
    var els = document.querySelectorAll("[" + attr + "]");
    var value = params.get(key);
    for (var i = 0; i < els.length; i++) {
      if (value !== null) { els[i].textContent = value; }
    }
  }
  fill("data-port", "port");
  fill("data-pid", "pid");
  fill("data-started", "started");
  fill("data-version", "version");
  fill("data-log", "log");
  var h1 = document.getElementById("title");
  if (h1) { h1.focus(); }
})();
</script>
</body>
</html>
